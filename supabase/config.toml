# Per-function JWT policy, pinned in source control so deploys can't drift.
# Webhooks/cron are called by external services with no Supabase JWT — they
# authenticate themselves (Paddle/Stripe signature verification, CRON_SECRET).
[functions.payments-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# RevenueCat server notifications authenticate via the shared Authorization
# header value (REVENUECAT_WEBHOOK_AUTH), not a Supabase JWT.
[functions.revenuecat-webhook]
verify_jwt = false

[functions.send-daily-prompt]
verify_jwt = false

[functions.send-collaboration-notification]
verify_jwt = true

# Weekly discovery generation. Serves two callers on one endpoint: pg_cron
# (authenticated by CRON_SECRET in the x-cron-secret header) and a signed-in
# Boardroom user manually refreshing one profile. Because the scheduled caller
# has no Supabase JWT, edge verification must stay off — the function checks
# the cron secret, then auth.getUser(), then ownership and tier itself.
[functions.generate-recommendations]
verify_jwt = false

# App-facing functions require a JWT at the platform edge (they additionally
# do their own auth.getUser() checks internally).
[functions.analyze-episode]
verify_jwt = true

[functions.video-chat]
verify_jwt = true

[functions.parse-deck]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

[functions.create-portal-session]
verify_jwt = true

[functions.delete-user-account]
verify_jwt = true

[functions.sync-revenuecat-subscription]
verify_jwt = true

[functions.get-paddle-price]
verify_jwt = true

# The MCP SDK performs OAuth 2.1 bearer verification itself and must be able to
# emit its own RFC 9728 challenge. Supabase gateway verification would reject
# the request before that handler runs, so this exception is explicit.
[functions.mcp]
verify_jwt = false

# Serves Open Graph HTML to link scrapers and a 302 to humans for shared
# insight cards, plus the generated PNG. Public by design — no Supabase JWT
# on a share link opened from Slack/iMessage/WhatsApp.
[functions.share-card]
verify_jwt = false
